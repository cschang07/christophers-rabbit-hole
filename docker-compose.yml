services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: productivity
      TZ: ${TIMEZONE:-Asia/Taipei}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d productivity"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/productivity
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_FILE: ${GOOGLE_TOKEN_FILE:-/data/google_token.json}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://boasting-cheek-squiggly.ngrok-free.dev/api/google/callback}
      TIMEZONE: ${TIMEZONE:-Asia/Taipei}
      TZ: ${TIMEZONE:-Asia/Taipei}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-voxtral-mini-2602}
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    volumes:
      - recordings:/data/recordings
      - ${HERMES_DIR:-${HOME}/.hermes}/google_token.json:/data/google_token.json:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Force host.docker.internal for the container: the host's .env uses
      # 127.0.0.1 (for `next dev`), but inside the container 127.0.0.1 is the
      # container itself. OrbStack forwards host.docker.internal to host loopback.
      HERMES_API_BASE_URL: http://host.docker.internal:8642
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    command: http --url=boasting-cheek-squiggly.ngrok-free.dev web:3008
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - web

volumes:
  pgdata:
  recordings:

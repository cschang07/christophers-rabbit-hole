services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: productivity
      TZ: ${TIMEZONE:-Asia/Taipei}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d productivity"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/productivity
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_TOKEN_FILE: ${GOOGLE_TOKEN_FILE:-/data/google_token.json}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3008/api/google/callback}
      TIMEZONE: ${TIMEZONE:-Asia/Taipei}
      TZ: ${TIMEZONE:-Asia/Taipei}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    volumes:
      - recordings:/data/recordings
      - ${HERMES_DIR:-${HOME}/.hermes}/google_token.json:/data/google_token.json:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  pgdata:
  recordings:
